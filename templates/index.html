<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Task Manager</h1>

      <section class="panel">
        <h2>Create task</h2>
        <form action="/tasks" method="post" class="inline-form">
          <input type="text" name="title" placeholder="Task title" required />
          <button type="submit">Add Task</button>
        </form>
      </section>

      <section class="panel">
        <h2>Tasks</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Status</th>
              <th>Update Status</th>
              <th>Delete</th>
            </tr>
          </thead>
          <tbody>
            {{TASK_ROWS}}
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
